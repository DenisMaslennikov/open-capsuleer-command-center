[project]
name = "occc-backend"
version = "0.1.0"
description = "OpenCapsuleerCommandCenter backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.16",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "aiohttp>=3.13",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-aiohttp>=1.1",
    "aioresponses>=0.7",
    "httpx2>=2.16",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
